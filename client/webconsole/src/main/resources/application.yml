server:
  port: 9090

spring:
  main:
    banner-mode: "off"

cherry:
  testtool:
    web:
      # 1件以上設定するとwebconsole全体(SPA配信含む全パス)にBasic認証がかかる。未設定時は認証なしで動作する。
      # passwordは平文、または"{bcrypt}"プレフィックス付きのBCryptハッシュのいずれも指定できる。
      # auth:
      #   users:
      #     - username: change-me
      #       password: change-me

# backendへのプロキシ先(既定はUnit2デモアプリの既定ポート8080)。
backend:
  protocol: http
  host: localhost
  port: 8080
  uri: ${backend.protocol}://${backend.host}:${backend.port}

logging:
  pattern:
    console: "%d{yyyy-MM-dd-HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{spanId:-}] [%thread] %logger - %msg%n%xEx"
  level:
    root: WARN
    cherry: TRACE
    org.springframework.cloud.gateway: DEBUG
